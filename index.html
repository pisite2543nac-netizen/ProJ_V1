async function runFiles(files,p){const box=$('#res');box.innerHTML='';for(const f of files){const d=document.createElement('div');d.innerHTML=`<p class="m">กำลังตรวจ ${esc(f.name)} ...</p>`;box.appendChild(d);try{
if(!/\.docx$/i.test(f.name))throw new Error('รองรับเฉพาะ .docx (ถ้าเป็น .doc ให้เปิดใน Word แล้วบันทึกเป็น .docx)');
const key=detectDoc(f.name)||guess(f.name);if(!key)throw new Error('ไม่รู้ว่าเป็นเอกสารส่วนไหน กรุณาเปลี่ยนชื่อไฟล์ตามตาราง เช่น 07_บทที่_1.docx');
const zip=await JSZip.loadAsync(await f.arrayBuffer()),P=await parseDocx(zip,DOMParser),items=check(P,f.name,{docKey:key,members:p.members,title:p.title_th});
await rpc('pjc_save_run',{tok:T(),p_doc:key,p_file:f.name,p_items:items});d.innerHTML=`<div class="card" style="margin:8px 0"><b>${esc(f.name)}</b> → ${DOCS[key]} ${badge(items.filter(i=>i.severity==='error').length,items.filter(i=>i.severity==='warning').length)}${itemsHtml(items)}</div>`}catch(e){d.innerHTML=`<div class="msg er">${esc(f.name)}: ${esc(e.message)}</div>`}}
OV=await rpc('pjc_overview',{tok:T()});const m=OV.projects[0];document.querySelectorAll('.card')[2].innerHTML=`<h2>3) ความคืบหน้าทั้งเล่ม</h2>${prog(m)}${docTable(m)}`}
function guess(n){n=n.normalize('NFC');const m=[[/หน้าปก/,'cover'],[/ลิขสิทธิ์/,'copyright'],[/ใบรับรอง/,'cert'],[/บทคัดย่อ/,'abstract'],[/กิตติกรรม/,'ack'],[/สารบัญ/,'toc'],[/บรรณานุกรม/,'bib'],[/ภาคผนวก/,'appendix'],[/ประวัติ/,'bio']].find(x=>x[0].test(n));if(m)return m[1];const c=n.match(/บทที่\s*_?([1-5])/);return c?'ch'+c[1]:null}
function itemsHtml(items){const o={error:'ต้องแก้ไข',warning:'ควรตรวจสอบ',pass:'ผ่านแล้ว'};return ['error','warning','pass'].map(s=>{const a=items.filter(i=>i.severity===s);return a.length?`<h3 class="${s[0]}" style="margin:12px 0 2px">${s==='error'?'❌':s==='warning'?'⚠️':'✅'} ${o[s]} (${a.length})</h3>`+a.map(i=>`<div class="it ${s}">${esc(i.message)}${i.fix&&s!=='pass'?`<div class="fix">💡 วิธีแก้: ${esc(i.fix)}</div>`:''}</div>`).join(''):''}).join('')}
window.show=async(id,name)=>{try{const it=await rpc('pjc_run_items',{tok:T(),p_run:id});$('#dt').innerHTML=`<div class="card"><h2>ผลตรวจ: ${esc(name)}</h2>${itemsHtml(it)}</div>`;$('#dt').scrollIntoView({behavior:'smooth'})}catch(e){alert(e.message)}};
function teacher(){const P=OV.projects,no=OV.students.filter(s=>!s.project_id);$('#app').innerHTML=`<div class="card"><h2>ภาพรวมทุกโครงงาน (${P.length})</h2>${P.map(p=>`<div style="margin-bottom:18px"><b>${esc(p.title_th)}</b><div class="m">${p.members.map(m=>m.student_id+' '+esc(m.full_name)).join(' · ')}</div>${prog(p)}${docTable(p)}</div>`).join('')||'<p class="m">ยังไม่มีโครงงาน</p>'}</div><div id="dt"></div>
<div class="card"><h2>นักศึกษาที่ยังไม่มีโครงงาน (${no.length})</h2><table>${no.map(s=>`<tr><td>${s.student_id}</td><td>${esc(s.full_name)}</td><td><button class="g" onclick="rs('${s.student_id}')">รีเซ็ตรหัสผ่าน</button></td></tr>`).join('')}</table></div>`}
window.rs=async id=>{if(confirm('รีเซ็ตรหัสผ่าน '+id+' เป็นรหัสเริ่มต้น?'))try{await rpc('pjc_reset_password',{tok:T(),sid:id});alert('รีเซ็ตแล้ว')}catch(e){alert(e.message)}};
load();
</script></body></html>
